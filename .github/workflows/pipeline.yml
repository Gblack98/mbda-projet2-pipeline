name: Pipeline quotidien

# Seul declencheur planifie du projet, le DAG Airflow reste en manuel.
# 18h37 et pas 18h00 : GitHub met les workflows en file d'attente en debut
# d'heure. Un run lance a 18h59 le 2026-08-07 n'a demarre que 16 h plus tard.
on:
  schedule:
    - cron: "37 18 * * 1-5"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # dbt-core tire dbt-core-experimental-parser, dont le build telecharge un
      # binaire depuis GitHub. Ce telechargement a coupe le 12 aout et fait
      # tomber toute l'execution. D'ou les reprises, comme dans common/reseau.py.
      - name: Dependances
        run: |
          for essai in 1 2 3; do
            pip install -r requirements.txt && exit 0
            echo "Installation en echec, tentative $essai sur 3."
            sleep 15
          done
          exit 1

      - name: Cle de service
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p ~/.gcp
          printf '%s' "$GCP_KEY" > ~/.gcp/mbda-projet2-sa.json

      - name: Profil dbt
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          dbt_pipeline:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: crucial-bonsai-418120
                dataset: marts
                keyfile: /home/runner/.gcp/mbda-projet2-sa.json
                threads: 4
                location: EU
          EOF

      - name: Ingestion
        run: python scripts/ingest.py

      - name: Modeles et tests dbt
        working-directory: dbt_pipeline
        run: |
          dbt deps
          dbt build

      - name: Alerte par mail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Pipeline MBDA
          to: ${{ secrets.MAIL_TO }}
          subject: "Echec du pipeline, run ${{ github.run_id }}"
          body: |
            L'execution du ${{ github.run_started_at }} a echoue.

            Etape en echec et journaux :
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
