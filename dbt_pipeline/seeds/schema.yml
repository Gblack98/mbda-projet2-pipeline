version: 2
seeds:
  - name: mapping_devise_cotation
    description: >
      Correspondance entre la devise de cotation brute renvoyée par Yahoo
      Finance (parfois en centimes : USX, GBp, ZAc) et sa devise pivot avec
      le facteur de division associé. Source unique consommée par
      fct_cotation_journaliere pour calculer cloture_eur.
    columns:
      - name: devise_cotation
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'USX', 'EUR', 'GBp', 'GBP', 'ZAc', 'CAD', 'JPY']
      - name: devise_pivot
        tests:
          - not_null
      - name: facteur
        tests:
          - not_null

  - name: paires_instrument
    description: >
      Paires société / matière première comparées par les modèles de
      corrélation. temoin marque la paire de contrôle, Orange / Or, qui ne
      correspond à aucun lien économique et dont le coefficient doit rester
      proche de zéro.
    columns:
      - name: paire_id
        tests:
          - unique
          - not_null
      - name: instrument_action
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_instruments')
                field: instrument_id
      - name: instrument_matiere
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_instruments')
                field: instrument_id
      - name: temoin
        tests:
          - not_null
