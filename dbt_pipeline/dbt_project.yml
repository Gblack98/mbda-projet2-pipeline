name: 'dbt_pipeline'
version: '1.0.0'
profile: 'dbt_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_pipeline:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
    # Couche decisionnelle : agregations, indicateurs, comparaisons dans le
    # temps. Materialisee dans marts, a cote du modele en etoile, pour que la
    # restitution n'ait qu'un seul dataset a brancher.
    analytique:
      +materialized: table

seeds:
  dbt_pipeline:
    +schema: staging
    paires_instrument:
      +column_types:
        temoin: boolean
