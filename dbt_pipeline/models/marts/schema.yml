version: 2
models:
  - name: dim_temps
    description: >
      Calendrier journalier borné dynamiquement sur la plage de dates
      réellement présente dans stg_cotations (min à max).
    columns:
      - name: date_jour
        tests:
          - unique
          - not_null
  - name: dim_instrument
    description: >
      Un instrument par ligne : 41 matières premières, actions et indices.
      categorie_export rattache le secteur à une catégorie Banque Mondiale,
      nul pour les secteurs sans équivalent (Telecoms, Actions, Volatilite).
    columns:
      - name: instrument_id
        tests:
          - unique
          - not_null
      - name: classe_actif
        tests:
          - not_null
  - name: dim_devise
    description: >
      Une devise par ligne, avec son régime de change dérivé de la
      variabilité de son taux face à l'euro sur l'historique disponible.
    columns:
      - name: devise_id
        tests:
          - unique
          - not_null
      - name: regime
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['arrime', 'gere', 'flottant', 'reference']
  - name: fct_exportations_pays
    description: >
      Table de faits annuelle : part de chaque catégorie dans les exportations
      d'un pays. Grain pays x catégorie x année. Ne se joint jamais
      directement à fct_cotation_journaliere, le grain est incompatible.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [pays, annee, categorie_export]
    columns:
      - name: pays
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: categorie_export
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_instrument')
                field: categorie_export
      - name: part_exportations
        tests:
          - not_null
  - name: fct_cotation_journaliere
    description: >
      Table de faits quotidienne : un instrument, un jour. cloture_eur passe la
      clôture native en euros via dim_devise, après division des cotations en
      centimes. variation_pct compare à la clôture native de la séance d'avant.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date_cotation, instrument_id]
    columns:
      - name: date_cotation
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_temps')
                field: date_jour
      - name: instrument_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_instrument')
                field: instrument_id
      - name: cloture
        tests:
          - not_null
      - name: cloture_eur
        tests:
          - not_null
      - name: devise_cotation
        tests:
          - accepted_values:
              arguments:
                values: ['USD', 'USX', 'EUR', 'GBp', 'GBP', 'ZAc', 'CAD', 'JPY']
      - name: variation_exploitable
        description: >
          Faux au premier jour coté d'un instrument, et dès qu'une des deux
          clôtures comparées n'est pas positive. Seul cas négatif de
          l'historique : le WTI le 2020-04-20.
        tests:
          - not_null
